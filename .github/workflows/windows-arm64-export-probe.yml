name: Windows ARM64 export probe

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Release-artifacts or release-candidate run whose windows-arm64 import receipt is probed
        required: true
      source_sha:
        description: Source commit of that run (names the receipt artifact)
        required: true

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-imports-windows-arm64-${{ inputs.source_sha }}
          path: receipt
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Resolve every imported pair in a native ARM64 process
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_RUN: ${{ inputs.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
          if ($arch -ne 'Arm64') { throw "probe process is $arch, not Arm64" }
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class ExportProbe {
            [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
            public static extern IntPtr LoadLibraryExW(string name, IntPtr file, uint flags);
            [DllImport("kernel32.dll", CharSet = CharSet.Ansi, SetLastError = true, ExactSpelling = true)]
            public static extern IntPtr GetProcAddress(IntPtr module, string name);
            [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
            public static extern uint GetModuleFileNameW(IntPtr module, StringBuilder path, uint size);
          }
          '@
          $receipt = Get-Content -Raw receipt/receipt.json | ConvertFrom-Json
          $pairs = @{}
          foreach ($binary in $receipt) {
            foreach ($pair in $binary.imports) { $pairs["$($pair[0].ToLowerInvariant())|$($pair[1])"] = $pair }
          }
          $modules = [ordered]@{}
          $unresolved = @()
          $resolved = 0
          foreach ($key in ($pairs.Keys | Sort-Object)) {
            $dll = $pairs[$key][0].ToLowerInvariant()
            $symbol = $pairs[$key][1]
            if (-not $modules.Contains($dll)) {
              $handle = [ExportProbe]::LoadLibraryExW($dll, [IntPtr]::Zero, 0x00000800)
              if ($handle -eq [IntPtr]::Zero) {
                $modules[$dll] = @{ handle = [IntPtr]::Zero; path = $null; sha256 = $null; error = [System.Runtime.InteropServices.Marshal]::GetLastWin32Error() }
              } else {
                $path = [System.Text.StringBuilder]::new(1024)
                [void][ExportProbe]::GetModuleFileNameW($handle, $path, 1024)
                $modules[$dll] = @{ handle = $handle; path = $path.ToString(); sha256 = (Get-FileHash -Algorithm SHA256 $path.ToString()).Hash.ToLowerInvariant(); error = 0 }
              }
            }
            $module = $modules[$dll]
            if ($module.handle -ne [IntPtr]::Zero -and [ExportProbe]::GetProcAddress($module.handle, $symbol) -ne [IntPtr]::Zero) { $resolved++ } else { $unresolved += ,@($dll, $symbol) }
          }
          $version = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          $result = [ordered]@{
            result = $(if ($unresolved.Count -eq 0) { 'PASS' } else { 'FAIL' })
            kind = 'exact native system export resolution'
            time = (Get-Date).ToUniversalTime().ToString('o')
            osVersion = [System.Environment]::OSVersion.Version.ToString()
            osBuild = "$($version.CurrentBuild).$($version.UBR)"
            osProduct = $version.ProductName
            processArchitecture = 'ARM64'
            runner = 'GitHub-hosted windows-11-arm'
            source = $env:SOURCE_SHA
            sourceRun = $env:SOURCE_RUN
            binaries = @($receipt | ForEach-Object { [ordered]@{ binary = $_.binary; sha256 = $_.sha256 } })
            resolved = $resolved
            unresolved = $unresolved.Count
            unresolvedPairs = $unresolved
            exportProbeMethod = 'ARM64 process: LoadLibraryExW per imported DLL with LOAD_LIBRARY_SEARCH_SYSTEM32 (0x00000800), then GetProcAddress for every imported symbol; module path and SHA256 recorded'
            systemModules = [ordered]@{}
          }
          foreach ($dll in $modules.Keys) { $result.systemModules[$dll] = [ordered]@{ path = $modules[$dll].path; sha256 = $modules[$dll].sha256; loadError = $modules[$dll].error } }
          New-Item -ItemType Directory -Force probe | Out-Null
          $result | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 probe/export-probe.json
          Get-Content probe/export-probe.json
          if ($unresolved.Count -ne 0) { throw "$($unresolved.Count) imported pairs did not resolve" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: windows-arm64-export-probe-${{ inputs.source_sha }}
          path: probe/
          if-no-files-found: warn
